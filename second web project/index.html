<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Planet - Task 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Container Layout using Flexbox & Grid -->
    <div class="container">
        
        <!-- Section 1: Contact Form with Validation -->
        <div class="card">
            <h2>Contact Us</h2>
            <form id="contactForm">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" placeholder="Enter your name">
                    <small class="error-msg" id="nameError"></small>
                </div>
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" placeholder="Enter your email">
                    <small class="error-msg" id="emailError"></small>
                </div>

                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" rows="3" placeholder="Your message"></textarea>
                    <small class="error-msg" id="messageError"></small>
                </div>

                <button type="submit">Submit Form</button>
            </form>
        </div>

        <!-- Section 2: Dynamic To-Do List -->
        <div class="card">
            <h2>Dynamic To-Do List</h2>
            <div class="todo-input-group">
                <input type="text" id="taskInput" placeholder="Add a new task...">
                <button id="addTaskBtn">Add</button>
            </div>
            <ul id="taskList"></ul>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
